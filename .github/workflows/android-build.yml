name: Android Build & Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify Zesto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Show Project Structure
        shell: bash
        run: |
          echo "=== PROJECT ROOT ==="
          ls -la

          echo "=== GRADLE FILES ==="
          find . -maxdepth 3 -type f \( \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print

      - name: Show Gradle Version
        run: ./gradlew --version

      - name: Clean Project
        run: ./gradlew clean --no-daemon --no-configuration-cache --stacktrace

      - name: Run Unit Tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Find Generated APK
        shell: bash
        run: |
          echo "=== GENERATED APK FILES ==="

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.gradle/*" \
            -print

      - name: Verify APK Exists
        shell: bash
        run: |
          APK=$(find . \
            -type f \
            -name "*.apk" \
            -not -path "./.gradle/*" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zesto-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "ZESTO BUILD SUMMARY"
          echo "======================================"

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.gradle/*" \
            -print || true
