name: Android Build & Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify Zesto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Show Gradle Version
        run: ./gradlew --version

      - name: Clean
        run: ./gradlew clean --no-daemon --no-configuration-cache --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace
        continue-on-error: true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Verify APK
        run: |
          echo "=== APK OUTPUT ==="
          find app/build/outputs -type f -name "*.apk" -print

          APK=$(find app/build/outputs -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

      - name: Prepare Zesto Package
        run: |
          mkdir -p build/zesto-package

          APK=$(find app/build/outputs -type f -name "*.apk" -print -quit)

          cp "$APK" build/zesto-package/zesto-debug.apk

          cat > build/zesto-package/README.txt <<'EOF'
Zesto Camera Virtualization Project

Application ID:
com.aistudio.zesto.vcam

Debug APK:
zesto-debug.apk

This package contains the APK produced by the Gradle build.
EOF

      - name: Upload Zesto APK
        uses: actions/upload-artifact@v4
        with:
          name: zesto-debug-apk
          path: build/zesto-package/zesto-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Zesto Package
        uses: actions/upload-artifact@v4
        with:
          name: zesto-package
          path: build/zesto-package/
          if-no-files-found: error
          retention-days: 14

      - name: Build Summary
        if: always()
        run: |
          echo "======================================"
          echo "ZESTO BUILD SUMMARY"
          echo "======================================"

          if [ -d app/build/outputs ]; then
            echo "Build output directory:"
            find app/build/outputs -maxdepth 4 -type f -print
          else
            echo "No build output directory found."
          fi
