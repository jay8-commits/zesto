name: Android Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify Zesto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK & Test Module
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Zesto Module Package
        run: |
          mkdir -p build/module-package
          cp app/build/outputs/apk/debug/*.apk build/module-package/zesto-streaming-service.apk
          cp app/build/outputs/apk/debug/*.apk build/module-package/zesto-lspatch-module.apk
          echo "Zesto Camera Virtualization Module Package" > build/module-package/README.txt
          echo "Package: com.example.zesto" >> build/module-package/README.txt
          echo "Hook Entry: com.example.zesto.hook.ZestoXposedInit" >> build/module-package/README.txt
          echo "IPC Authority: com.example.zesto.frameprovider" >> build/module-package/README.txt

      - name: Upload Zesto Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zesto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Zesto Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zesto-module
          path: build/module-package/*
          if-no-files-found: error
          retention-days: 14

