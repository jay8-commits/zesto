name: Android Build & Test

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify Zesto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-disabled: true

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          ./gradlew --version --no-configuration-cache

      - name: Clean Project
        run: |
          ./gradlew clean --no-daemon --no-configuration-cache --stacktrace

      - name: Run Unit Tests
        continue-on-error: true
        run: |
          ./gradlew testDebugUnitTest \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Build Debug APK
        id: build_apk
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --info

      - name: Verify Debug APK
        run: |
          echo "=== APK OUTPUT ==="
          ls -lah app/build/outputs/apk/debug/

          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

      - name: Prepare Zesto Module Package
        run: |
          mkdir -p build/module-package

          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp "$APK" build/module-package/zesto-streaming-service.apk
          cp "$APK" build/module-package/zesto-lspatch-module.apk

          cat > build/module-package/README.txt <<'EOF'
Zesto Camera Virtualization Module Package

Application ID:
com.aistudio.zesto.vcam

Debug APK:
zesto-streaming-service.apk

Module APK:
zesto-lspatch-module.apk

Important:
The APK and module package are the same debug APK.
Physical LSPatch/LSPosed camera interception still requires
verification on the target Android device.
EOF

      - name: Upload Zesto Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zesto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Zesto Module
        uses: actions/upload-artifact@v4
        with:
          name: zesto-module
          path: build/module-package/*
          if-no-files-found: error
          retention-days: 14

      - name: Build Summary
        if: always()
        run: |
          echo "======================================"
          echo "ZESTO BUILD SUMMARY"
          echo "======================================"

          if [ -d app/build/outputs/apk/debug ]; then
            echo "APK directory exists."
            ls -lah app/build/outputs/apk/debug/
          else
            echo "APK directory does not exist."
          fi
