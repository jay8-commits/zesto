name: Android Build & Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify Zesto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-disabled: true

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew

      - name: Verify Gradle Wrapper
        run: |
          echo "=== GRADLE WRAPPER ==="
          ls -lah gradle/wrapper/
          test -f gradle/wrapper/gradle-wrapper.jar
          ./gradlew --version --no-daemon --no-configuration-cache

      - name: Show Project Structure
        run: |
          echo "=== PROJECT ==="
          ls -la

          echo "=== GRADLE FILES ==="
          find . -maxdepth 3 -type f \( \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print

      - name: Clean Project
        run: |
          ./gradlew clean \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Run Unit Tests
        continue-on-error: true
        run: |
          ./gradlew testDebugUnitTest \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Find APK
        run: |
          echo "=== GENERATED APK FILES ==="
          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.gradle/*" \
            -print

      - name: Verify APK
        run: |
          APK=$(find . \
            -type f \
            -name "*.apk" \
            -not -path "./.gradle/*" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

      - name: Upload Zesto APK
        uses: actions/upload-artifact@v4
        with:
          name: zesto-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Summary
        if: always()
        run: |
          echo "======================================"
          echo "ZESTO BUILD SUMMARY"
          echo "======================================"

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.gradle/*" \
            -print || true
